services:
  api:
    build: .
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/fleetpilot
      JWT_SECRET: dev-secret-change-me
      CORS_ORIGINS: http://localhost:5173,https://hb-source.github.io
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
