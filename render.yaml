# Render Blueprint for the FleetPilot backend API.
# Apply via Render → New → Blueprint, pointed at this repository.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: fleetpilot-api
    runtime: node
    plan: free
    region: frankfurt # change to the region nearest your MongoDB Atlas cluster
    rootDir: server
    # --include=dev forces devDependencies (typescript, @types/node) to install
    # even though NODE_ENV=production would otherwise omit them; the TypeScript
    # build needs them. The runtime only uses prod deps + the compiled dist/.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Paste your MongoDB Atlas connection string in the Render dashboard.
      # Include the database name, e.g. .../fleetpilot?retryWrites=true&w=majority
      - key: MONGODB_URI
        sync: false
      # Strong random secrets generated by Render (kept out of the repo).
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      # Email OTP via Resend. Paste your API key in the dashboard; without it
      # OTP codes are logged to the service logs instead of delivered.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: FleetPilot <onboarding@resend.dev>
      - key: MFA_ISSUER
        value: FleetPilot
      - key: CLIENT_URL
        value: https://hb-source.github.io/Car-Fleet-App/
      # Browser origins allowed to call the API (your GitHub Pages site).
      - key: CORS_ORIGINS
        value: https://hb-source.github.io
      # Seed the admin + demo fleet on first boot (idempotent — safe to leave on).
      - key: SEED_ON_START
        value: "true"
      - key: SEED_ADMIN_EMAIL
        value: admin@fleetpilot.demo
      # You will be prompted to enter these when applying the blueprint.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_DRIVER_PASSWORD
        sync: false
